<text class="lbl" x="785.0" y="572" text-anchor="middle" fill="#FDE68A">save fields, findings, risk, audit events</text></g>
<circle r="6" fill="#FCD34D" opacity="0" filter="url(#glow)"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.615;0.660;1"><mpath href="#m9"/></animateMotion><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.615;0.660;1" dur="14s" repeatCount="indefinite"/></circle>
