<text class="lbl" x="315.0" y="332" text-anchor="middle" fill="#C7D2FE">POST /process · Done</text></g>
<circle r="6" fill="#A5B4FC" opacity="0" filter="url(#glow)"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.225;0.270;1"><mpath href="#m3"/></animateMotion><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.225;0.270;1" dur="14s" repeatCount="indefinite"/></circle>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.290;0.975" dur="14s" repeatCount="indefinite"/>
<path id="m4" class="res" d="M474 380 H158" marker-end="url(#mres)"/>
<text class="lbl" x="315.0" y="372" text-anchor="middle" fill="#99F6E4">202 progress snapshot</text></g>
<circle r="6" fill="#5EEAD4" opacity="0" filter="url(#glow)"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.290;0.335;1"><mpath href="#m4"/></animateMotion><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.290;0.335;1" dur="14s" repeatCount="indefinite"/></circle>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.355;0.975" dur="14s" repeatCount="indefinite"/>
<path id="m5" class="req" d="M156 420 H472" marker-end="url(#mreq)"/>
<text class="lbl" x="315.0" y="412" text-anchor="middle" fill="#C7D2FE">GET /progress/stream · live updates (SSE)</text></g>
<circle r="6" fill="#A5B4FC" opacity="0" filter="url(#glow)"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.355;0.400;1"><mpath href="#m5"/></animateMotion><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.355;0.400;1" dur="14s" repeatCount="indefinite"/></circle>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.420;0.975" dur="14s" repeatCount="indefinite"/>
