<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.485;0.975" dur="14s" repeatCount="indefinite"/>
<path id="m7" class="res" d="M794 500 H488" marker-end="url(#mres)"/>
<text class="lbl" x="640.0" y="492" text-anchor="middle" fill="#99F6E4">text + bounding boxes</text></g>
