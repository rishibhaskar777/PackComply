<circle r="6" fill="#A5B4FC" opacity="0" filter="url(#glow)"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.810;0.855;1"><mpath href="#m12"/></animateMotion><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.810;0.855;1" dur="14s" repeatCount="indefinite"/></circle>
