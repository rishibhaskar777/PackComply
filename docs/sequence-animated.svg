<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" role="img" aria-labelledby="t d" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<title id="t">One inspection, from upload to verdict</title>
<desc id="d">Animated sequence diagram: the browser creates an inspection and uploads photos, OCR starts immediately, the app subscribes to live progress, FastAPI reads each photo with on-device OCR in English and Hindi, extracts declarations, checks 14 rules, scores risk, saves everything with an audit trail in PostgreSQL, streams step updates and returns the verdict and full record.</desc>
<style>
.bg{fill:#0B1020}
.box{fill:#121A2B;stroke:#26314A;stroke-width:1.5}
.h{fill:#E6EAF2;font-size:16px;font-weight:600}
.s{fill:#94A0B8;font-size:12px}
.life{stroke:#26314A;stroke-width:2;stroke-dasharray:3 7;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-10}}
.lbl{font-size:13.5px;font-weight:500}
.req{stroke:#818CF8;fill:none;stroke-width:2}
.res{stroke:#2DD4BF;fill:none;stroke-width:2;stroke-dasharray:6 5}
.db{stroke:#FBBF24;fill:none;stroke-width:2}
.self{stroke:#A78BFA;fill:none;stroke-width:2}
@media (prefers-reduced-motion: reduce){.life{animation:none}}
</style>
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="mreq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#818CF8"/></marker>
<marker id="mres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2DD4BF"/></marker>
<marker id="mdb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FBBF24"/></marker>
<marker id="mself" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A78BFA"/></marker>
</defs>
<rect class="bg" width="1240" height="800" rx="20"/>
<text x="40" y="50" fill="#E6EAF2" font-size="24" font-weight="700">One inspection, from upload to verdict</text>
<text x="40" y="76" class="s" font-size="14">What happens between the phone and the laptop when an inspector checks a label.</text>
<g transform="translate(1004 32)"><rect width="200" height="30" rx="15" fill="#10241F" stroke="#1F5A4C"/><circle cx="18" cy="15" r="4" fill="#34D399"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle><text x="30" y="20" fill="#6EE7B7" font-size="12.5" font-weight="600">Live · about 20 s per photo</text></g>

<g font-size="15" font-weight="600" fill="#C7D2FE">
<text x="40" y="118">Upload · each photo is stored and OCR starts right away<animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.215" dur="14s" repeatCount="indefinite"/></text>
<text x="40" y="118" opacity="0">Start · the app asks for live progress (Server-Sent Events)<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.215;0.410" dur="14s" repeatCount="indefinite"/></text>
<text x="40" y="118" opacity="0">Processing · OCR, extraction, 14 rules, risk, saved with an audit trail<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.410;0.670" dur="14s" repeatCount="indefinite"/></text>
<text x="40" y="118" opacity="0">Result · live step updates, then the verdict and the full record<animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.670" dur="14s" repeatCount="indefinite"/></text>
</g>
<rect x="40" y="134" width="1160" height="4" rx="2" fill="#1A2236"/><rect x="40" y="134" width="0" height="4" rx="2" fill="#818CF8"><animate attributeName="width" values="0;1160" dur="14s" repeatCount="indefinite"/></rect>
<line class="life" x1="150" y1="196" x2="150" y2="740"/>
<line class="life" x1="480" y1="196" x2="480" y2="740"/>
<line class="life" x1="800" y1="196" x2="800" y2="740"/>
<line class="life" x1="1090" y1="196" x2="1090" y2="740"/>
<rect class="box" x="65.0" y="150" width="170" height="46" rx="12"/><text class="h" x="150" y="170" text-anchor="middle">You</text><text class="s" x="150" y="187" text-anchor="middle">phone or browser</text>
<rect class="box" x="395.0" y="150" width="170" height="46" rx="12"/><text class="h" x="480" y="170" text-anchor="middle">FastAPI</text><text class="s" x="480" y="187" text-anchor="middle">API server</text>
<rect class="box" x="715.0" y="150" width="170" height="46" rx="12"/><text class="h" x="800" y="170" text-anchor="middle">OCR service</text><text class="s" x="800" y="187" text-anchor="middle">PaddleOCR · en + hi</text>
<rect class="box" x="1005.0" y="150" width="170" height="46" rx="12"/><text class="h" x="1090" y="170" text-anchor="middle">PostgreSQL</text><text class="s" x="1090" y="187" text-anchor="middle">evidence store</text>
<rect x="474" y="452" width="12" height="136" rx="3" fill="#818CF8" opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;0.85;0" keyTimes="0;0.420;0.665" dur="14s" repeatCount="indefinite"/></rect>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.030;0.975" dur="14s" repeatCount="indefinite"/>
<path id="m0" class="req" d="M156 220 H472" marker-end="url(#mreq)"/>
<text class="lbl" x="315.0" y="212" text-anchor="middle" fill="#C7D2FE">POST /api/inspections · create the inspection</text></g>
<circle r="6" fill="#A5B4FC" opacity="0" filter="url(#glow)"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.030;0.075;1"><mpath href="#m0"/></animateMotion><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.030;0.075;1" dur="14s" repeatCount="indefinite"/></circle>
