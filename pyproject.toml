[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packcomply"
version = "0.1.0"
description = "AI-assisted package-label inspection system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
  "pillow>=10.4,<12.0",
  "python-multipart>=0.0.9,<1.0",
  "opencv-python-headless>=4.10,<5.0",
  "paddleocr>=3.0,<4.0",
  "paddlepaddle>=3.0,<4.0",
  "cryptography>=43,<46",
  "reportlab>=4.2,<5.0",
  # HarfBuzz shaping so Devanagari matras and conjuncts render correctly in PDFs.
  "uharfbuzz>=0.39,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
# Noto fonts (SIL Open Font License) used by the PDF report.
"backend.app" = ["assets/fonts/*.ttf", "assets/fonts/OFL.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
